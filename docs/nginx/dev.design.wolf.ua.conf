server {
    listen                  80;
    server_name             dev.design.wolf.ua;
    return                  301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.design.wolf.ua;
    root /home/connect/design.wolf.ua;

    ssl_certificate               "/home/connect/ssl/dev.design.wolf.ua.crt";
    ssl_certificate_key           "/home/connect/ssl/dev.design.wolf.ua.key";

    index index.php;

    location ~ ^/(tests|vendor|docs|helpers|views|pages)/ {deny all;}
    location ~ ^/(composer\.(json|lock)|phpunit\.xml|CLAUDE\.md)$ {deny all;}

    location / {
        index index.php;
        try_files       $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite         ^/(.*)$ /index.php?view=$1;
    }

    location ~ \.php$ {
        set $root_path /home/connect/design.wolf.ua;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $root_path$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param DOCUMENT_ROOT $root_path;
    }

    location ~* ^.+\.(jpg|jpeg|gif|png|ico|css|js|woff|woff2|ttf)$ {
        expires  30d;
    }

    location ~ /\. {deny all;}
}
